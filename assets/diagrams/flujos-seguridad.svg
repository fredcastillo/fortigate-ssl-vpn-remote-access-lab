<svg xmlns="http://www.w3.org/2000/svg" width="950" height="550" viewBox="0 0 950 550" role="img"><style>text{font-family:Arial,sans-serif} .title{font-size:30px;font-weight:700;fill:#12233f} .sub{font-size:15px;fill:#526079} .label{font-size:17px;font-weight:700;fill:#12233f} .ip{font-size:13px;fill:#405069}</style><rect width="100%" height="100%" fill="#f5f7fc"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#607594"/></marker></defs><text x="35" y="48" class="title">Dos accesos, dos permisos</text><text x="35" y="77" class="sub">Mismo servidor · publicación HTTPS · administración SSH autenticada</text><rect x="35" y="120" width="240" height="110" rx="15" fill="#fff1ef" stroke="#bfcee1" stroke-width="2"/><text x="53" y="150" class="label">SIN VPN</text><text x="53" y="175" class="ip">Usuario VLAN 10</text><text x="53" y="196" class="ip">HTTPS público: funciona</text><text x="53" y="217" class="ip">SSH privado: timeout</text><rect x="35" y="340" width="240" height="115" rx="15" fill="#eaf0ff" stroke="#bfcee1" stroke-width="2"/><text x="53" y="370" class="label">CON VPN</text><text x="53" y="395" class="ip">vpnuser autenticado</text><text x="53" y="416" class="ip">IP del pool SSL-VPN</text><text x="53" y="437" class="ip">SSH privado: funciona</text><rect x="520" y="120" width="380" height="110" rx="15" fill="#eef9f3" stroke="#bfcee1" stroke-width="2"/><text x="538" y="150" class="label">VIP HTTPS TCP/443</text><text x="538" y="175" class="ip">203.0.113.26:443 → 10.21.75.130:443</text><text x="538" y="196" class="ip">Política WAN → port2 · servicio HTTPS</text><rect x="520" y="340" width="380" height="125" rx="15" fill="#eef9f3" stroke="#bfcee1" stroke-width="2"/><text x="538" y="370" class="label">SSL-VPN TCP/10443</text><text x="538" y="395" class="ip">203.0.113.26:10443 → ssl.root</text><text x="538" y="416" class="ip">Política ssl.root → port2 · solo SSH</text><text x="538" y="437" class="ip">Origen SSH observado: 10.212.134.200</text><path d="M275,175 L520,175" stroke="#607594" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M275,395 L520,395" stroke="#607594" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="320" y="156" class="sub">Acceso web público</text><text x="320" y="375" class="sub">Túnel de acceso remoto</text><path d="M275,245 L520,245" stroke="#d84a4a" stroke-width="3" stroke-dasharray="6 5"/><text x="310" y="278" fill="#b32727" font-size="16">SSH sin túnel: NO ACCESO</text><text x="35" y="510" class="sub">El Site-to-Site anterior permanece inactivo. No se abre SSH en WAN.</text></svg>