# Consulta de lectura: show firewall vip
config firewall vip
    edit "VIP_HTTPS_WEBSERVER"
        set uuid 4b6325a2-be8c-51f1-3fa5-6897c9f97e2d
        set extip 203.0.113.26
        set mappedip "10.21.75.130"
        set extintf "port1"
        set portforward enable
        set extport 443
        set mappedport 443
    next
end


# Consulta de lectura: show firewall policy
config firewall policy
    edit 3
        set name "WEBSERVER_A_INTERNET"
        set uuid bf98f650-bc9c-51f1-85e8-98c78d01cba1
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "LAN_SERVIDOR"
        set dstaddr "all"
        set schedule "always"
        set service "ALL"
        set nat enable
    next
    edit 2
        set name "WAN_to_WEBSERVER_HTTPS"
        set uuid c38cafda-be8c-51f1-2f9d-d7255ab83f27
        set srcintf "port1"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "VIP_HTTPS_WEBSERVER"
        set schedule "always"
        set service "HTTPS"
    next
edit 4
        set name "SLVPN_to_WEBSERVER_SSH"
        set uuid 05624854-be95-51f1-afb0-8201a9c34f27
        set srcintf "ssl.root"
        set dstintf "port2"
        set action accept
        set srcaddr "all"
        set dstaddr "WEBSERVER"
        set schedule "always"
        set service "SSH"
        set groups "SSLVPN_USERS"
    next
end


# Consulta de lectura: show vpn ssl settings
config vpn ssl settings
    set servercert "Fortinet_Factory"
    set tunnel-ip-pools "SSLVPN_TUNNEL_ADDR1"
    set tunnel-ipv6-pools "SSLVPN_TUNNEL_IPv6_ADDR1"
    set source-interface "port1"
    set source-address "all"
    set source-address6 "all"
    set default-portal "REMOTE_ACCESS"
    config authentication-rule
        edit 1
            set groups "SSLVPN_USERS"
            set portal "REMOTE_ACCESS"
        next
    end
end


# Consulta de lectura: show vpn ssl web portal
config vpn ssl web portal
    edit "REMOTE_ACCESS"
        set tunnel-mode enable
        set ipv6-tunnel-mode enable
        set ip-pools "SSLVPN_TUNNEL_ADDR1"
        set ipv6-pools "SSLVPN_TUNNEL_IPv6_ADDR1"
    next
end


# Consulta de lectura: show user local
config user local
    edit "guest"
        set type password
        set passwd "[REDACTED]"
    next
    edit "vpnuser"
        set type password
        set passwd-time "[REDACTED]"
        set passwd "[REDACTED]"
    next
end


# Consulta de lectura: show user group
config user group
    edit "SSO_Guest_Users"
    next
    edit "Guest-group"
        set member "guest"
    next
    edit "SSLVPN_USERS"
        set member "vpnuser"
    next
end

