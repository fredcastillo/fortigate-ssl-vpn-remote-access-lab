    next
    edit "WEBSERVER"
        set uuid 8396dba8-be91-51f1-f915-382116f7a21f
        set comment "Servidor Web HTTPS y SSH"
        set associated-interface "port2"
        set subnet 10.21.75.130 255.255.255.255
