# Configuración real de las nueve secciones académicas. Export por show individual; no es un backup global del appliance.
# Secciones reales de red y VPN, obtenidas mediante show, secretos redactados.
# Consulta de lectura: show system interface
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.26 255.255.255.252
        set allowaccess ping
        set type physical
        set snmp-index 1
    next
    edit "port2"
        set vdom "root"
        set ip 10.21.75.129 255.255.255.240
        set allowaccess ping https http
        set type physical
        set snmp-index 2
    next
    edit "port3"
        set vdom "root"
        set type physical
        set snmp-index 3
    next
    edit "port4"
        set vdom "root"
        set type physical
        set snmp-index 4
next
    edit "port5"
        set vdom "root"
        set ip 20.21.75.1 255.255.255.0
        set allowaccess ping https http
        set type physical
        set alias "PORT_FOR_CONFIG"
        set snmp-index 5
    next
    edit "port6"
        set vdom "root"
        set type physical
        set snmp-index 6
    next
    edit "port7"
        set vdom "root"
        set type physical
        set snmp-index 7
    next
    edit "port8"
        set vdom "root"
        set type physical
        set snmp-index 8
    next
edit "port9"
        set vdom "root"
        set type physical
        set snmp-index 9
    next
    edit "port10"
        set vdom "root"
        set type physical
        set snmp-index 10
    next
    edit "naf.root"
        set vdom "root"
        set type tunnel
        set src-check disable
        set snmp-index 11
    next
    edit "l2t.root"
        set vdom "root"
        set type tunnel
        set snmp-index 12
    next
    edit "ssl.root"
        set vdom "root"
        set type tunnel
set alias "SSL VPN interface"
        set snmp-index 13
    next
    edit "fortilink"
        set vdom "root"
        set fortilink enable
        set ip 10.255.1.1 255.255.255.0
        set allowaccess ping fabric
        set type aggregate
        set lldp-reception enable
        set lldp-transmission enable
        set snmp-index 14
    next
    edit "VPN-TO-SITE-A"
        set vdom "root"
        set type tunnel
        set snmp-index 15
        set interface "port3"
    next
end


# Consulta de lectura: show router static
config router static
    edit 1
        set gateway 203.0.113.25
        set device "port1"
    next
end


